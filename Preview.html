<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Cards Preview</title>
    <link rel="stylesheet" href="./assets/App.css" />
  </head>
  <body>
    <div class="container">
      <div class="user-card">
        <img
          src="./assets/profile.svg"
          alt="profile default image"
          class="avatar"
        />

        <div class="card-content">
          <div class="card-header">
            <h2 class="user-name">User</h2>
            <span class="role-badge secondary">Admin</span>
          </div>

          <span class="status-badge online">Online</span>
        </div>
      </div>

      <div class="user-card">
        <img src="./assets/profile.svg" alt="profile default image" class="avatar" />

        <div class="card-content">
          <div class="card-header">
            <h2 class="user-name">User</h2>
            <span class="role-badge primary">Member</span>
          </div>

          <span class="status-badge offline">Offline</span>
        </div>
      </div>

      <div class="user-card">
        <img src="./assets/profile.svg" alt="profile default image" class="avatar" />

        <div class="card-content">
          <div class="card-header">
            <h2 class="user-name">User</h2>
            <span class="role-badge primary">Member</span>
          </div>

          <span class="status-badge online">Online</span>
        </div>
      </div>
    </div>
  </body>
</html>
